<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>Faça seu cadastro - Instragram</title>
</head>
<body>

  <!--AREA CONTAINER-->
 <div class="wrapper">
  <!--AREA DA ESQUERDA-->
  <div id="container-sigup">
  
    <!--FIM DA ESQUERDA-->
  


    <!--AREA DA DIREITA-->
    <div class="column right ">
      <div class="login-panel">
        <div class="logo">
          <img class="logo-img" src="./assets/logo.png" alt="Instagram">
          
        </div>
        <div class="message">
          <spn>Cadastre-se para ver fotos e vídeos dos seus amigos.</span>
        </div>

        <button class="cta-button">
          Entrar com o Facebook
        </button>

        <div class="divisor-container">
          <div class="line"></div>
          <div class="divisor-tag">OU</div>
          <div class="line"></div>
        </div>

        <form>
          <input  placeholder="Numero de Celular ou email" type="text" name="email"/>
          <input  placeholder="Nome completo" type="text" name="name" />
          <input  placeholder="username" type="text" name="username" />
          <input  placeholder="Senha" type="password" name="password" />

          <input type="submit" value="Entrar"/>
        </form>
      </div>
       <div class="infobox">
      <p>Tem uma conta? <a href="index.html">Conecte-se</a></p>
      </div>

      <div class="get-app-panel">
        Obtenha o aplicativo.
        <div class="app-buttons">
          <a href="#"><img src="./assets/appstore.png" alt="App Store"></a>
          <a href="#"><img src="./assets/googleplay.png" alt="Google Play"></a>
         
        </div>
      </div>


    </div>
    <!--AREA DA DIREITA-->

   

 </div>
  <!--AREA CONTAINER-->

  <!--Area do Rodapé-->
  <footer>
    <div class="footer-inner">
      <a href="#">About us</a>
      <a href="#">Suport</a>
      <a href="#">Blog</a>
      <a href="#">Press</a>
      <a href="#">API</a>
      <a href="#">Jobs</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Directory</a>
      <a href="#">Profiles</a>
      <a href="#">Hashtags</a>
      <a href="#">Language</a>
   
    <div class="text-small">@copy; 2024 Instagram do Facebook</div>
    </div>
   
   
  </footer>
 </div>
</body>
</html>
